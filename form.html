<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Куттуктоо Жазуу 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in;
        }

        .header p {
            font-size: 1.15em;
            opacity: 0.95;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-card {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            animation: fadeIn 0.6s ease-in;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.error {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #c33;
            display: block;
            font-weight: 500;
        }

        .status.success {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #3c3;
            display: block;
            font-weight: 500;
        }

        .status.loading {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
            display: block;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8em;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎂 Куттуктоо Жазуу</h1>
            <p>Апамдын туулган күнүнө</p>
        </div>

        <div class="form-card">
            <div id="status"></div>
            <form id="wishForm">
                <div class="form-group">
                    <label for="name">Атыңыз:</label>
                    <input type="text" id="name" required placeholder="Атыңызды жазыңыз">
                </div>
                <div class="form-group">
                    <label for="message">Куттуктоо:</label>
                    <textarea id="message" required placeholder="Куттуктооңузду жазыңыз..."></textarea>
                </div>
                <button type="submit" class="submit-btn">🎁 Куттуктоо Жөнөтүү</button>
            </form>
        </div>

    <script>
        const CONFIG = { apiUrl: '/api/wishes' };

        // Жаңы куттуктоо кошуу
        async function addWish(name, message) {
            const form = document.getElementById('wishForm');
            const status = document.getElementById('status');
            const submitBtn = form.querySelector('.submit-btn');

            submitBtn.disabled = true;
            status.innerHTML = '<div class="status loading">⏳ Жөнөтүлүүдө...</div>';

            try {
                const putResponse = await fetch(CONFIG.apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, message })
                });

                const responseText = await putResponse.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(`Сервер API жооп бербеди (HTTP ${putResponse.status}). Vercel'ге акыркы өзгөртүүлөрдү deploy кылыңыз.`);
                }
                if (!putResponse.ok) {
                    throw new Error(result.error || `Сервер ката кайтарды (HTTP ${putResponse.status}).`);
                }

                status.innerHTML = '<div class="status success">✅ Куттуктоо ийгиликтүү жөнөтүлдү! Башкы бетке өтүңүз...</div>';
                form.reset();

                setTimeout(() => {
                    window.location.href = 'https://macbookali07-debug.github.io/apam-tuulgan-kunu/';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                const errorBox = document.createElement('div');
                errorBox.className = 'status error';
                errorBox.textContent = `❌ Ката: ${error.message}`;
                status.replaceChildren(errorBox);
            } finally {
                submitBtn.disabled = false;
            }
        }

        // Форма иштетүү
        document.getElementById('wishForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();

            if (name && message) {
                addWish(name, message);
            }
        });
    </script>
</body>
</html>
